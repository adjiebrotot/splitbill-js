<!doctype html>
<html lang="en" class="i18n-wait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split Bill</title>
<meta name="description" content="Split bills with friends and on trips.">
<link rel="manifest" href="/app/manifest.json">
<meta name="theme-color" content="#8bb8f8">
<link rel="icon" href="/app/static/icons/icon-192.png?v=34543553">
<link rel="apple-touch-icon" href="/app/static/icons/icon-192.png?v=34543553">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app/static/css/shared.css?v=e41dd7c7">
<script src="/app/static/js/i18n-all.js?v=678aaec8"></script>
<script src="/app/static/js/boot.js?v=466484cf" data-page="login"></script>
</head>
<body class="auth-page">
  <div class="login-wrap">
    <a href="/" class="login-back"><svg class="icon" aria-hidden="true"><use href="/app/static/assets/icons.svg?v=17f4531f#i-arrow-left"></use></svg> <span data-i18n="auth.back_home">Back to home</span></a>
    <form class="login-card" id="login-form" novalidate>
      <div class="login-logo">
        <span class="logo-icon"><svg class="icon" aria-hidden="true"><use href="/app/static/assets/icons.svg?v=17f4531f#i-receipt"></use></svg></span>
        <h1 data-i18n="app.name">Split Bill</h1>
        <p data-i18n="app.tagline">Split bills with friends and on trips</p>
      </div>
      <div class="login-error" id="login-error" role="alert"></div>
      <div class="field">
        <label for="login-identifier" data-i18n="auth.identifier">Username or email</label>
        <input type="text" id="login-identifier" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="field">
        <label for="login-password" data-i18n="auth.password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="remember-me" checked>
        <label for="remember-me" data-i18n="auth.remember">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="signin-btn" data-i18n="auth.signin">Sign In</button>
      <a class="btn btn-ghost btn-full" id="google-btn" href="/app/api/auth/google/start" hidden data-i18n="auth.google">Sign in with Google</a>
      <p class="login-hint"><span data-i18n="auth.no_account">No account yet?</span> <a href="/register" data-i18n="auth.create">Create one</a></p>
      <div class="lang-flags" role="group" aria-label="Language">
        <button type="button" class="lang-flag-btn" data-lang="en">English</button>
        <button type="button" class="lang-flag-btn" data-lang="id">Bahasa Indonesia</button>
      </div>
    </form>
  </div>
  <script src="/app/static/js/ui.js?v=b30fcd5a"></script>
  <script src="/app/static/js/i18n.js?v=3c7c0ae8"></script>
  <script src="/app/static/js/auth.js?v=2cde165a"></script>
</body>
</html>
