<!doctype html>
<html lang="en" class="i18n-wait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split Bill</title>
<link rel="manifest" href="/app/manifest.json">
<meta name="theme-color" content="#8bb8f8">
<link rel="icon" href="/app/static/icons/icon-192.png?v=34543553">
<link rel="apple-touch-icon" href="/app/static/icons/icon-192.png?v=34543553">
<link rel="preload" href="/app/static/assets/fonts/dm-sans-latin-wght-normal.woff2?v=9fea608a" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app/static/css/shared.min.css?v=26bc0050">
<script src="/app/static/js/i18n-all.js?v=fc38c15f"></script>
<script src="/app/static/js/boot.min.js?v=54359d3c" data-page="home" data-auth="1"></script>
</head>
<body>
  <div id="globalTooltip"></div>
  <main class="main-content">
    <div class="settings-wrap">
      <div class="settings-header"><h1 data-i18n="home.title">My splits</h1></div>
      <div class="banner warn" id="offline-banner" hidden></div>
      <!-- An info banner, folded until opened; the choice is remembered on this device. -->
      <details class="banner info collapse-card" id="verify-card" hidden>
        <summary><h2 data-i18n="verify.title">Confirm your email</h2> <svg class="icon" aria-hidden="true"><use href="/app/static/assets/icons.svg?v=17f4531f#i-chevron-down"></use></svg></summary>
        <div class="stack">
          <p class="card-desc" id="verify-desc"></p>
          <div class="field">
            <label for="verify-code" data-i18n="verify.code">Code</label>
            <input type="text" id="verify-code" class="code-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost btn-compact" id="verify-resend" data-i18n="verify.resend">Send Again</button>
            <button type="button" class="btn btn-primary btn-compact" id="verify-btn" data-i18n="verify.confirm">Confirm</button>
          </div>
        </div>
      </details>
      <!-- The one thing done most: a bill, straight away. Open trips (newest
           activity first, up to 3) get their own button above the one-off. -->
      <div id="trip-bills"></div>
      <button type="button" class="btn btn-primary btn-full page-action" id="new-bill"><svg class="icon" aria-hidden="true"><use href="/app/static/assets/icons.svg?v=17f4531f#i-receipt"></use></svg> <span data-i18n="home.split_one">Split One Bill</span></button>
      <section class="tool-card">
        <h2><svg class="icon" aria-hidden="true"><use href="/app/static/assets/icons.svg?v=17f4531f#i-list"></use></svg> <span data-i18n="home.splits">Splits</span>
          <span class="tool-head-actions">
            <button type="button" class="btn btn-ghost btn-compact" id="splits-sort" data-i18n-aria="home.sort" aria-label="Sort" hidden></button>
            <button type="button" class="btn btn-ghost btn-compact" id="new-trip">+ <span data-i18n="home.new_trip">New Trip</span></button>
          </span>
        </h2>
        <div class="tool-tbl-wrap" id="splits-wrap">
          <table class="tool-tbl">
            <thead><tr>
              <th data-i18n="home.col_name">Name</th>
              <th class="num" data-i18n="home.col_spent">My spending</th>
              <th class="num" data-i18n="home.col_mine">My balance</th>
            </tr></thead>
            <tbody id="splits-body"></tbody>
          </table>
        </div>
        <div class="tool-pagination" id="splits-pager" hidden></div>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="modal-new" role="dialog" aria-modal="true" aria-labelledby="new-title">
    <form class="modal-card" id="new-form" novalidate>
      <div class="modal-head">
        <h2 class="modal-title" id="new-title" data-i18n="home.new_trip">New Trip</h2>
        <button type="button" class="btn btn-ghost btn-compact btn-icon modal-close" onclick="closeModal('modal-new')" data-i18n-aria="common.close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="/app/static/assets/icons.svg?v=17f4531f#i-x"></use></svg></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="new-name" data-i18n="new.name">Name</label>
          <input type="text" id="new-name" maxlength="80" required>
        </div>
        <div class="field">
          <label for="new-currency" data-i18n="new.settle_currency">Settle in</label>
          <select id="new-currency"></select>
        </div>
        <div class="field">
          <label for="new-person"><span data-i18n="new.people">People</span> <span class="tooltip-icon" tabindex="0" data-i18n-tip="new.people_tip" data-tip="Type a name for someone without the app, or @username for an app user.">?</span></label>
          <div class="line-row">
            <input type="text" id="new-person" maxlength="40" data-i18n-ph="new.person_ph" placeholder="Name or @username">
            <button type="button" class="btn btn-ghost btn-compact" id="new-person-add">+ <span data-i18n="common.add">Add</span></button>
          </div>
          <div class="chips" id="new-people"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary" id="new-save" data-i18n="new.create">Create</button>
      </div>
    </form>
  </div>

  <script src="/app/static/js/engine.js?v=7c879c47"></script>
  <script src="/app/static/js/ui.min.js?v=5ff6dcc2"></script>
  <script src="/app/static/js/i18n.min.js?v=23384dda"></script>
  <script src="/app/static/js/topbar.min.js?v=448cca10"></script>
  <script src="/app/static/js/currency.min.js?v=69826b20"></script>
  <script src="/app/static/js/sb.min.js?v=68929ddb"></script>
  <script src="/app/static/js/home.min.js?v=bbaaa1e5"></script>
  <script src="/app/static/js/bill.min.js?v=50e009bd"></script>
</body>
</html>
