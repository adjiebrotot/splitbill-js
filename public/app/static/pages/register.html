<!doctype html>
<html lang="en" class="i18n-wait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split Bill</title>
<link rel="manifest" href="/app/manifest.json">
<meta name="theme-color" content="#8bb8f8">
<link rel="icon" href="/app/static/icons/icon-192.png?v=34543553">
<link rel="apple-touch-icon" href="/app/static/icons/icon-192.png?v=34543553">
<link rel="preload" href="/app/static/assets/fonts/dm-sans-latin-wght-normal.woff2?v=9fea608a" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app/static/css/shared.min.css?v=782c1c14">
<script src="/app/static/js/i18n-all.js?v=c889fa2d"></script>
<script src="/app/static/js/boot.min.js?v=54359d3c" data-page="register"></script>
</head>
<body class="auth-page">
  <div class="login-wrap">
    <a href="/login" class="login-back"><svg class="icon" aria-hidden="true"><use href="/app/static/assets/icons.svg?v=17f4531f#i-arrow-left"></use></svg> <span data-i18n="auth.signin">Sign In</span></a>
    <form class="login-card" id="register-form" novalidate>
      <div class="login-logo">
        <span class="logo-icon"><svg class="icon" aria-hidden="true"><use href="/app/static/assets/icons.svg?v=17f4531f#i-receipt"></use></svg></span>
        <h1 data-i18n="auth.create_title">Create account</h1>
      </div>
      <div class="login-error" id="login-error" role="alert"></div>
      <div class="field">
        <label for="reg-name" data-i18n="auth.display_name">Your name</label>
        <input type="text" id="reg-name" autocomplete="name" maxlength="40" required>
      </div>
      <div class="field">
        <label for="reg-username" data-i18n="auth.username">Username</label>
        <input type="text" id="reg-username" autocomplete="username" autocapitalize="none" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" required>
      </div>
      <div class="field">
        <label for="reg-email" data-i18n="auth.email">Email</label>
        <input type="email" id="reg-email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="reg-password"><span data-i18n="auth.password">Password</span> <span class="tooltip-icon" tabindex="0" data-i18n-tip="auth.password_rule" data-tip="At least 8 characters with one symbol.">?</span></label>
        <input type="password" id="reg-password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="register-btn" data-i18n="auth.create_btn">Create Account</button>
      <p class="login-hint"><span data-i18n="auth.have_account">Already have an account?</span> <a href="/login" data-i18n="auth.signin">Sign In</a></p>
      <div class="lang-flags" role="group" aria-label="Language">
        <button type="button" class="lang-flag-btn" data-lang="en">English</button>
        <button type="button" class="lang-flag-btn" data-lang="id">Bahasa Indonesia</button>
      </div>
    </form>
  </div>
  <div id="globalTooltip"></div>
  <script src="/app/static/js/ui.min.js?v=57c20b9a"></script>
  <script src="/app/static/js/i18n.min.js?v=23384dda"></script>
  <script src="/app/static/js/auth.min.js?v=b8c913fe"></script>
</body>
</html>
